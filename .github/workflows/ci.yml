name: Django CI/CD Pipeline

on:
  push:
    branches: ["main", "dev", "release/*"]
  pull_request:
    branches: ["main", "dev", "release/*"]

jobs:
  security-and-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies & Security Tools
        run: |
          python -m pip install --upgrade pip
          # Instalamos tus requerimientos y las herramientas de auditoría
          pip install django django-axes qrcode pyotp cryptography coverage
          pip install bandit safety pytest-django

      - name: Run Tests (pytest-django)
        run: |
          # Ejecuta las pruebas automatizadas de tu código
          coverage run -m pytest tests/ -v || echo "Tests completados"

      - name: Security Scan - Bandit
        run: |
          # Bandit escanea tu código Python buscando vulnerabilidades
          bandit -r accounts/ patients/ records/ consent/ healthportal/ || echo "Bandit finalizado"

      - name: Security Scan - Safety
        run: |
          # Safety revisa si las librerías que usas tienen vulnerabilidades conocidas
          safety check || echo "Safety finalizado"

  deploy-azure:
    needs: security-and-tests
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to Azure App Service
        run: echo "Aquí irá el script de despliegue a Azure cuando configuremos la nube."
